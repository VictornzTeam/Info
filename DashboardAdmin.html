<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin - Victornz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }
    header {
      background: #1f2937;
      color: white;
      padding: 16px;
    }
    main {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
      margin-bottom: 16px;
    }
    button {
      padding: 10px 16px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h2>Dashboard Admin</h2>
  </header>

  <!-- CONTENT -->
  <main>
    <div class="card">
      <h3>Selamat Datang, <span id="admin-name">Admin</span> 👋</h3>
    </div>

    <div class="card">
      <h4>Menu Admin</h4>
      <ul>
        <a href="RegisterMember.html" class="btn-register">Register Member</a>
        <li>Kelola User</li>
        <li>Lihat Data</li>
        <li>Pengaturan Sistem</li>
      </ul>
    </div>
    <button type="button" onclick="logout()">Logout</button>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://guhtxeycuhtczoehfzz.supabase.co";
  const supabaseKey = "sb_publishable_wZUYKQIrWfNaXAbQW1eJtA_VzTrw9LO";
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  async function protectAdminPage() {
    // 🔐 CEK LOGIN
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
      location.replace("login.html");
      return;
    }

    // 📦 AMBIL ROLE
    const { data: profile, error } = await supabase
      .from("profiles")
      .select("name, role")
      .eq("id", user.id)
      .single();

    // 🚫 BLOK JIKA BUKAN ADMIN
    if (error || profile.role !== "Admin") {
      await supabase.auth.signOut();
      alert("Akses Admin Ditolak");
      location.replace("login.html");
      return;
    }

    // ✅ TAMPILKAN NAMA ADMIN
    document.getElementById("admin-name").innerText =
      profile.name || "Admin";
  }

  protectAdminPage();

  async function logout() {
    await supabase.auth.signOut();
    location.href = "login.html";
  }
</script>

</body>
</html>
