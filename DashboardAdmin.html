<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin - Victornz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }
    header {
      background: #1f2937;
      color: white;
      padding: 16px;
    }
    main {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
      margin-bottom: 16px;
    }
    button {
      padding: 10px 16px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h2>Dashboard Admin</h2>
  </header>

  <!-- CONTENT -->
  <main>
    <div class="card">
      <h3>Selamat Datang, <span id="admin-name">Admin</span> 👋</h3>
    </div>

    <div class="card">
      <h4>Menu Admin</h4>
      <ul>
        <li>Kelola User</li>
        <li>Lihat Data</li>
        <li>Pengaturan Sistem</li>
      </ul>
    </div>
    <button type="button" onclick="logout()">Logout</button>
  </main>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyAJjm8a7AAUjSWaeTKXI6Tr7l9HBQJttyk",
    authDomain: "victornz-database.firebaseapp.com",
    projectId: "victornz-database",
    storageBucket: "victornz-database.appspot.com",
    messagingSenderId: "200672722714",
    appId: "1:200672722714:web:870346cbe0a4c0de5b76a3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async user => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists() || snap.data().role !== "Admin") {
      alert("Akses ditolak");
      location.href = "login.html";
      return;
    }

    document.getElementById("admin-name").innerText =
      snap.data().name || "Admin";
  });

  window.logout = async function () {
    await signOut(auth);
    location.href = "login.html";
  };
</script>

</body>
</html>
