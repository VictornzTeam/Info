<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Dashboard - Victornz</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="flex h-screen overflow-hidden">

    <!-- Overlay Mobile -->
  <div id="sidebarOverlay"
       class="fixed inset-0 z-20 bg-black/50 hidden lg:hidden"
       onclick="closeSidebar()">
  </div>
  
  <!-- SIDEBAR -->
  <aside id="sidebar"
    class="fixed inset-y-0 left-0 z-30 w-64 bg-slate-900 text-white
           transform -translate-x-full transition-transform duration-300
           lg:translate-x-0 lg:static lg:inset-auto
           flex flex-col">  

    <!-- Logo -->
    <div class="h-16 flex items-center justify-center bg-slate-950 border-b border-slate-800">
      <div class="flex items-center text-yellow-400 font-bold text-lg">
        <span class="bg-yellow-400 text-black w-8 h-8 flex items-center justify-center rounded mr-2">V</span>
        VICTORNZ
      </div>
    </div>

    <!-- MENU -->
    <nav class="flex-1 px-4 py-6 space-y-2">
      <div class="px-4 py-3 rounded-lg bg-yellow-500 text-white shadow">
        <i class="fas fa-home w-6"></i> Dashboard
      </div>

      <button onclick="absen()" 
        class="w-full flex items-center px-4 py-3 rounded-lg
               bg-slate-800 hover:bg-yellow-500 transition">
        <i class="fas fa-calendar-check w-6"></i>
        Hasil Build Saya
      </button>
    </nav>

    <!-- LOGOUT -->
    <div class="p-4 border-t border-slate-800">
      <button onclick="logout()"
        class="w-full flex items-center px-4 py-2 text-red-400 hover:text-red-300">
        <i class="fas fa-sign-out-alt w-6"></i> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- TOPBAR MOBILE -->
    <header class="lg:hidden bg-white border-b px-4 py-3 flex items-center">
      <button onclick="toggleSidebar()" class="text-gray-600 mr-3">
        <i class="fas fa-bars text-xl"></i>
      </button>
      <span class="font-semibold">Member Menu</span>
    </header>

    <!-- CONTENT -->
    <!-- CONTENT -->
<main class="flex-1 p-6 space-y-6">

  <!-- WELCOME CARD -->
  <div class="bg-white rounded-xl p-6 shadow">
    <h2 class="text-xl font-bold mb-2">
      Selamat Datang, <span id="member-name">Member</span> 👋
    </h2>
    <p class="text-gray-500">
      Status akun Anda aktif dan siap digunakan.
    </p>
  </div>

  <!-- PROFILE CARD -->
  <div class="bg-white rounded-xl shadow p-6 flex flex-col md:flex-row gap-6 items-center">

    <!-- FOTO PROFIL MINECRAFT -->
    <img id="mc-avatar"
      src="https://mc-heads.net/avatar/Steve/128"
      class="w-28 h-28 rounded-lg border-4 border-yellow-400 bg-gray-100"/>

    <!-- INFO PROFIL -->
    <div class="flex-1 space-y-2">
      <h3 class="text-xl font-bold" id="profile-name">Nama Member</h3>
      <p class="text-sm text-gray-500" id="profile-email">email@email.com</p>
      <p class="text-sm">📱 WhatsApp: <span id="profile-wa">-</span></p>
      <p class="text-sm">🧠 Keahlian: <span id="profile-skills">-</span></p>
      <p class="text-sm">🎮 Game: <span id="profile-games">-</span></p>
      <p class="text-sm text-gray-600 italic" id="profile-about">
        Tentang saya...
      </p>
    </div>

  </div>

</main>
  
<!-- ================= FIREBASE LOGIC (TIDAK DIUBAH) ================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJjm8a7AAUjSWaeTKXI6Tr7l9HBQJttyk",
    authDomain: "victornz-database.firebaseapp.com",
    projectId: "victornz-database",
    storageBucket: "victornz-database.firebasestorage.app",
    messagingSenderId: "200672722714",
    appId: "1:200672722714:web:870346cbe0a4c0de5b76a3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 🔒 PROTEKSI MEMBER
  onAuthStateChanged(auth, async user => {
    if (!user) {
      location.href = "login.html";
      return;
    }

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if (!snap.exists() || snap.data().role !== "Member") {
      alert("Akses ditolak");
      location.href = "login.html";
      return;
    }

    const data = snap.data();

// Nama
document.getElementById("member-name").innerText = data.name || "Member";
document.getElementById("profile-name").innerText = data.name || "-";

// Email
document.getElementById("profile-email").innerText = data.email || "-";

// WhatsApp
document.getElementById("profile-wa").innerText = data.whatsapp || "-";

// About
document.getElementById("profile-about").innerText =
  data.about || "Belum ada deskripsi.";

// Skills (array → text)
document.getElementById("profile-skills").innerText =
  Array.isArray(data.skills)
    ? data.skills.join(", ")
    : data.skills || "-";

// Games
document.getElementById("profile-games").innerText =
  Array.isArray(data.games)
    ? data.games.join(", ")
    : data.games || "-";

// Minecraft Avatar (KEPALA)
const mcName = data.minecraftUsername || "Steve";
document.getElementById("mc-avatar").src =
  `https://mc-heads.net/avatar/${mcName}/128`;
  });

  // ✅ ABSEN BULANAN
  window.absen = async function () {
    const user = auth.currentUser;
    if (!user) return;

    await updateDoc(doc(db, "users", user.uid), {
      lastAbsen: serverTimestamp(),
      status: "Active"
    });

    alert("Absen berhasil dicatat 👍");
  };

  // 🔓 LOGOUT
  window.logout = async function () {
    await signOut(auth);
    location.href = "login.html";
  };
</script>

<!-- SIDEBAR TOGGLE -->
<script>
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");

  function openSidebar() {
    sidebar.classList.remove("-translate-x-full");
    overlay.classList.remove("hidden");
  }

  function closeSidebar() {
    sidebar.classList.add("-translate-x-full");
    overlay.classList.add("hidden");
  }

  function toggleSidebar() {
    if (sidebar.classList.contains("-translate-x-full")) {
      openSidebar();
    } else {
      closeSidebar();
    }
  }

  // 🔒 AUTO CLOSE SAAT RESIZE KE DESKTOP
  window.addEventListener("resize", () => {
    if (window.innerWidth >= 1024) {
      overlay.classList.add("hidden");
      sidebar.classList.remove("-translate-x-full");
    } else {
      sidebar.classList.add("-translate-x-full");
    }
  });
</script>


</body>
</html>
