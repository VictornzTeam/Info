<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Victornz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- UI STYLE (KUNING) -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #facc15, #fde047);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 32px;
      border-radius: 14px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 30px rgba(0,0,0,.15);
      text-align: center;
    }
    h2 {
      margin-bottom: 6px;
      color: #92400e;
    }
    p {
      color: #78350f;
      font-size: 14px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #facc15;
      outline: none;
      font-size: 14px;
    }
    input:focus {
      border-color: #f59e0b;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .btn-admin {
      background: #f59e0b;
      color: white;
    }
    .btn-admin:hover {
      background: #d97706;
    }
    .btn-member {
      background: #fde047;
      color: #78350f;
    }
    .btn-member:hover {
      background: #facc15;
    }
    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: #92400e;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://guhtxeycuhtczoehfzz.supabase.co";
  const supabaseKey = "sb_publishable_wZUYKQIrWfNaXAbQW1eJtA_VzTrw9LO";
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  async function loginWithRole(expectedRole) {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Email dan password wajib diisi");
      return;
    }

    // 🔐 LOGIN
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert(error.message);
      return;
    }

    const user = data.user;

    // 📦 Ambil role dari profiles
    const { data: profile, error: profileError } = await supabase
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if (profileError || !profile) {
      alert("Profile tidak ditemukan");
      return;
    }

    // 🚫 CEK ROLE SESUAI TOMBOL
    if (profile.role !== expectedRole) {
      await supabase.auth.signOut();
      alert(`Akun ini bukan ${expectedRole}`);
      return;
    }

    // 🚀 REDIRECT
    if (expectedRole === "Admin") {
      location.href = "admin.html";
    } else {
      location.href = "member.html";
    }
  }

  // 🔘 BUTTON HANDLERS
  function loginMember() {
    loginWithRole("Member");
  }

  function loginAdmin() {
    loginWithRole("Admin");
  }
</script>


</head>

<body>

  <div class="login-box">
    <h2>Victornz</h2>
    <p>Silakan login sesuai peran Anda</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button class="btn btn-member" onclick="loginMember()">Login sebagai Member</button>
    <button class="btn btn-admin" onclick="loginAdmin()">Login sebagai Admin</button>
    
    <div class="footer">
      © Victornz Team
    </div>
  </div>

</body>
</html>
