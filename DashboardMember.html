<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Member - Victornz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f5f9;
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 16px 24px;
    }
    main {
      padding: 24px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    .btn.logout {
      background: #dc2626;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h2>Dashboard Member</h2>
    <p>Victornz Member Area</p>
  </header>

  <!-- CONTENT -->
  <main>
    <div class="card">
      <h3>Selamat Datang 👋</h3>
      <p>Anda login sebagai <strong>Member</strong>.</p>
    </div>

    <div class="card">
      <h4>Fitur Member</h4>
      <ul>
        <li>Profil Saya</li>
        <li>Riwayat Aktivitas</li>
        <li>Pengaturan Akun</li>
      </ul>
    </div>

    <button class="btn logout" onclick="logout()">Logout</button>
  </main>

  <!-- 🔐 FIREBASE AUTH & ROLE PROTECTION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔥 GANTI DENGAN firebaseConfig MILIK KAMU
    const firebaseConfig = {
      apiKey: "AIzaSyAJjm8a7AAUjSWaeTKXI6Tr7l9HBQJttyk",
      authDomain: "victornz-database.firebaseapp.com",
      projectId: "victornz-database",
      storageBucket: "victornz-database.firebasestorage.app",
      messagingSenderId: "200672722714",
      appId: "1:200672722714:web:870346cbe0a4c0de5b76a3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 🔒 PROTEKSI MEMBER
    onAuthStateChanged(auth, async user => {
      if (!user) {
        location.href = "login.html";
        return;
      }

      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "Member") {
        alert("Akses ditolak");
        location.href = "login.html";
      }
    });

    <button onclick="absen()" class="btn">Absen Bulan Ini</button>

    // 🔓 LOGOUT
    window.logout = async function () {
      await signOut(auth);
      location.href = "login.html";
    };
  </script>

</body>
</html>
