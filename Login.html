<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Victornz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔥 FIREBASE CONFIG (PUNYA KAMU)
    const firebaseConfig = {
      apiKey: "AIzaSyAJjm8a7AAUjSWaeTKXI6Tr7l9HBQJttyk",
      authDomain: "victornz-database.firebaseapp.com",
      projectId: "victornz-database",
      storageBucket: "victornz-database.firebasestorage.app",
      messagingSenderId: "200672722714",
      appId: "1:200672722714:web:870346cbe0a4c0de5b76a3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Email dan password wajib diisi");
        return;
      }

      try {
        // 🔐 LOGIN FIREBASE AUTH
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid;

        // 📦 AMBIL ROLE DARI FIRESTORE
        const ref = doc(db, "users", uid);
        const snap = await getDoc(ref);

        if (!snap.exists()) {
          alert("Data user tidak ditemukan di Firestore");
          return;
        }

        const userData = snap.data();

        // 🔀 REDIRECT BERDASARKAN ROLE
        if (userData.role === "Admin") {
          window.location.href = "DashboardAdmin.html";
        } 
        else if (userData.role === "Member") {
          window.location.href = "DashboardMember.html";
        } 
        else {
          alert("Role tidak dikenali");
        }

      } catch (error) {
        alert("Login gagal: email atau password salah");
        console.error(error);
      }
    };
  </script>
</head>

<body style="font-family:Arial; padding:40px">

  <h2>Login Victornz</h2>

  <input id="email" type="email" placeholder="Email" /><br><br>
  <input id="password" type="password" placeholder="Password" /><br><br>

  <button onclick="login()">Login</button>

</body>
</html>
